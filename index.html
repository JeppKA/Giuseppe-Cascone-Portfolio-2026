<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giuseppe Cascone — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #131313;
    --paper: #f2f0ea;
    --pink: #ff2f7e;
    --grey: #8c8c8c;
    --line: rgba(255,255,255,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--paper);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ambient vignette, echoing the render lighting in the deck */
  .vignette {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 600px at 78% 15%, rgba(255,47,126,0.08), transparent 60%),
      radial-gradient(ellipse 800px 800px at 15% 85%, rgba(255,255,255,0.04), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .eyebrow {
    position: relative;
    z-index: 1;
    padding: 28px 32px 0;
    font-size: 0.72rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--grey);
    opacity: 0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }

  .title-img {
    width: min(560px, 78vw);
    height: auto;
    display: block;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.25s forwards;
  }

  .byline {
    margin-top: 22px;
    font-size: 0.95rem;
    color: var(--grey);
    letter-spacing: 0.3px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.45s forwards;
  }

  .byline strong {
    color: var(--paper);
    font-weight: 600;
  }

  .cta-row {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.6s forwards;
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .piggy-cta {
    width: 46px;
    height: auto;
    transform: rotate(-8deg);
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    transition: transform 0.25s ease;
  }

  .btn-group:hover .piggy-cta {
    transform: rotate(4deg) scale(1.06);
  }

  .btn-view {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--paper);
    color: #0a0a0a;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.2px;
    padding: 15px 32px;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 0 rgba(255,47,126,0);
  }

  .btn-view:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,47,126,0.25);
  }

  .btn-view svg { width: 16px; height: 16px; transition: transform 0.2s ease; }
  .btn-view:hover svg { transform: translateX(3px); }

  /* pink signature squiggle, echo of the hand signature on every deck page */
  .squiggle {
    margin-top: 4px;
    width: 68px;
    height: 22px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.75s forwards;
  }

  footer {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 26px 32px 32px;
    border-top: 1px solid var(--line);
    font-size: 0.78rem;
    color: var(--grey);
    opacity: 0;
    animation: fadeUp 0.7s ease 0.85s forwards;
  }

  .footer-left { display: flex; flex-direction: column; gap: 4px; }
  .footer-left a { color: var(--paper); text-decoration: none; }
  .footer-left a:hover { color: var(--pink); }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--grey);
  }

  .footer-right {
    gap: 6px;
  }

  .piggy {
    width: 32px;
    height: auto;
    opacity: 0.9;
  }

  .piggy-small { width: 22px; }
  .piggy-tiny { width: 15px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    footer { flex-direction: column; align-items: flex-start; gap: 16px; }
    .footer-right { align-self: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

  <div class="vignette"></div>

  <div class="eyebrow">Automotive Designer</div>

  <main>
    <img src="Portfoliologo.png" alt="Portfolio" class="title-img">
    <p class="byline">of <strong>Giuseppe Cascone</strong> — Exterior Design &amp; AI Integration Specialist</p>

    <div class="cta-row">
      <div class="btn-group">
        <a class="btn-view" href="portfolio.pdf" target="_blank" rel="noopener">
          View the portfolio
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <img src="Maialino.png" alt="" class="piggy-cta">
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <span>Email: <a href="mailto:jep.cascone@gmail.com">jep.cascone@gmail.com</a></span>
      <span>Cell: <a href="tel:+393274570103">+39 327 4570103</a></span>
      <span><a href="https://instagram.com/jep_casco" target="_blank" rel="noopener">@jep_casco</a></span>
    </div>
    <div class="footer-right">
      <img src="Maialino.png" alt="" class="piggy">
      <img src="Maialino.png" alt="" class="piggy piggy-small">
      <img src="Maialino.png" alt="" class="piggy piggy-tiny">
      <span>2026</span>
    </div>
  </footer>

</body>
</html>
