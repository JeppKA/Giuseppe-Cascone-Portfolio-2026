<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giuseppe Cascone — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --bg-2: #131313;
    --paper: #f2f0ea;
    --pink: #ff2f7e;
    --grey: #8c8c8c;
    --line: rgba(255,255,255,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--paper);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* full-screen field where hearts float freely, replacing the old animated vignette */
  .hearts-field {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .hearts-field img {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }

  .eyebrow {
    position: relative;
    z-index: 3;
    padding: 28px 32px 0;
    font-size: 0.72rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--grey);
    opacity: 0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  main {
    position: relative;
    z-index: 3;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }

  .title-img {
    width: min(560px, 78vw);
    height: auto;
    display: block;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.25s forwards;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -moz-user-select: none;
    -ms-user-select: none;
    position: relative;
  }

  .title-img.dragging {
    cursor: grabbing;
    transition: none;
  }

  .byline {
    margin-top: 22px;
    font-size: 0.95rem;
    color: var(--grey);
    letter-spacing: 0.3px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.45s forwards;
  }

  .byline strong {
    color: var(--paper);
    font-weight: 600;
    transition: color 0.35s ease;
  }

  .byline:hover strong {
    color: var(--pink);
  }

  .cta-row {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 72px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.6s forwards;
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .piggy-cta {
    width: 46px;
    height: auto;
    transform: rotate(-8deg);
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    transition: transform 0.25s ease;
  }

  .btn-group:hover .piggy-cta {
    transform: rotate(4deg) scale(1.06);
  }

  .sig-link {
    display: inline-block;
    line-height: 0;
    margin-top: 2px;
  }

  .sig-img {
    width: 108px;
    height: auto;
    display: block;
    opacity: 0.92;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    transform: rotate(-3deg);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
  }

  .sig-link:hover .sig-img {
    transform: rotate(2deg) scale(1.08);
    opacity: 1;
  }

  .sig-link:active .sig-img,
  .sig-img.stamp {
    animation: stampHit 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes stampHit {
    0%   { transform: rotate(-3deg) scale(1); }
    35%  { transform: rotate(-8deg) scale(0.82); }
    65%  { transform: rotate(4deg) scale(1.12); }
    100% { transform: rotate(-3deg) scale(1); }
  }

  .btn-view {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--paper);
    color: #0a0a0a;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.2px;
    padding: 15px 32px;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 0 rgba(255,47,126,0);
    overflow: hidden;
  }

  .btn-view::before {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,47,126,0.35), transparent);
    transform: skewX(-20deg);
    transition: left 0.65s ease;
  }

  .btn-view:hover::before {
    left: 130%;
  }

  .btn-view:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,47,126,0.25);
  }

  .btn-view svg { width: 16px; height: 16px; transition: transform 0.2s ease; position: relative; }
  .btn-view:hover svg { transform: translateX(3px); }

  /* pink signature squiggle, echo of the hand signature on every deck page */
  .squiggle {
    margin-top: 4px;
    width: 68px;
    height: 22px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.75s forwards;
  }

  footer {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 26px 32px 32px;
    border-top: 1px solid var(--line);
    font-size: 0.78rem;
    color: var(--grey);
    opacity: 0;
    animation: fadeUp 0.7s ease 0.85s forwards;
  }

  .footer-left { display: flex; flex-direction: column; gap: 4px; }
  .footer-left a { color: var(--paper); text-decoration: none; }
  .footer-left a:hover { color: var(--pink); }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--grey);
  }

  .footer-right {
    gap: 6px;
  }

  .piggy {
    width: 32px;
    height: auto;
    opacity: 0.9;
  }

  .piggy-small { width: 22px; }
  .piggy-tiny { width: 15px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    footer { flex-direction: column; align-items: flex-start; gap: 16px; }
    .footer-right { align-self: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

  <div class="hearts-field" id="heartsField"></div>

  <div class="eyebrow">Automotive Designer</div>

  <main>
    <img src="Portfoliologo.png" alt="Portfolio" class="title-img" draggable="false">
    <p class="byline">of <strong>Giuseppe Cascone</strong> — Exterior Design &amp; AI Integration Specialist</p>


    <div class="cta-row">
      <div class="btn-group">
        <a class="btn-view" href="portfolio.pdf" target="_blank" rel="noopener">
          View the portfolio
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <img src="Maialino.png" alt="" class="piggy-cta">
      </div>

      <a href="https://instagram.com/jep_casco" target="_blank" rel="noopener" class="sig-link" aria-label="Visita il profilo Instagram di Giuseppe Cascone">
        <img src="Jeka.png" alt="firma Jeka" class="sig-img">
      </a>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <span>Email: <a href="mailto:jep.cascone@gmail.com">jep.cascone@gmail.com</a></span>
      <span>Cell: <a href="tel:+393274570103">+39 327 4570103</a></span>
      <span><a href="https://instagram.com/jep_casco" target="_blank" rel="noopener">@jep_casco</a></span>
    </div>
    <div class="footer-right">
      <img src="Maialino.png" alt="" class="piggy">
      <img src="Maialino.png" alt="" class="piggy piggy-small">
      <img src="Maialino.png" alt="" class="piggy piggy-tiny">
      <span>2026</span>
    </div>
  </footer>

  <script>
    (function () {
      var field = document.getElementById('heartsField');
      if (!field) return;

      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var count = window.innerWidth < 600 ? 7 : 13;
      var hearts = [];

      for (var i = 0; i < count; i++) {
        var img = document.createElement('img');
        img.src = 'Cuoricino.png';
        img.alt = '';

        var size = 16 + Math.random() * 24;         // 16–40px
        var opacity = (0.28 + Math.random() * 0.42).toFixed(2); // 0.28–0.70
        img.style.width = size + 'px';
        img.style.height = 'auto';
        img.style.opacity = opacity;
        field.appendChild(img);

        var w = window.innerWidth, h = window.innerHeight;
        var x = Math.random() * Math.max(1, w - size);
        var y = Math.random() * Math.max(1, h - size);
        var angle = Math.random() * Math.PI * 2;
        var speed = 0.12 + Math.random() * 0.28;     // slow, ambient drift
        var vx = Math.cos(angle) * speed;
        var vy = Math.sin(angle) * speed;
        var rot = Math.random() * 360;
        var rotSpeed = (Math.random() - 0.5) * 0.12;

        hearts.push({ el: img, x: x, y: y, vx: vx, vy: vy, size: size, rot: rot, rotSpeed: rotSpeed });
      }

      // place them once even if motion is reduced, just without animating
      hearts.forEach(function (p) {
        p.el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(1) + 'deg)';
      });
      if (reduced) return;

      function tick() {
        var w = window.innerWidth, h = window.innerHeight;
        hearts.forEach(function (p) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotSpeed;

          if (p.x <= 0) { p.x = 0; p.vx *= -1; }
          if (p.x + p.size >= w) { p.x = w - p.size; p.vx *= -1; }
          if (p.y <= 0) { p.y = 0; p.vy *= -1; }
          if (p.y + p.size >= h) { p.y = h - p.size; p.vy *= -1; }

          p.el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) rotate(' + p.rot.toFixed(1) + 'deg)';
        });
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
  <script>
    (function () {
      var logo = document.querySelector('.title-img');
      if (!logo) return;

      // hard-block the browser's native "drag this image" behavior
      logo.addEventListener('dragstart', function (e) { e.preventDefault(); });

      var offsetX = 0, offsetY = 0;       // current accumulated position
      var startX = 0, startY = 0;         // pointer position when drag started
      var startOffsetX = 0, startOffsetY = 0;
      var dragging = false;

      function getPoint(e) {
        if (e.touches && e.touches.length) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function startDrag(e) {
        dragging = true;
        logo.classList.add('dragging');
        var p = getPoint(e);
        startX = p.x;
        startY = p.y;
        startOffsetX = offsetX;
        startOffsetY = offsetY;
        e.preventDefault();
      }

      function moveDrag(e) {
        if (!dragging) return;
        var p = getPoint(e);
        offsetX = startOffsetX + (p.x - startX);
        offsetY = startOffsetY + (p.y - startY);
        logo.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
        e.preventDefault();
      }

      function endDrag() {
        dragging = false;
        logo.classList.remove('dragging');
      }

      // mouse
      logo.addEventListener('mousedown', startDrag);
      document.addEventListener('mousemove', moveDrag);
      document.addEventListener('mouseup', endDrag);

      // touch
      logo.addEventListener('touchstart', startDrag, { passive: false });
      document.addEventListener('touchmove', moveDrag, { passive: false });
      document.addEventListener('touchend', endDrag);
      document.addEventListener('touchcancel', endDrag);
    })();

    // signature "stamp" animation on click/tap
    (function () {
      var sig = document.querySelector('.sig-img');
      if (!sig) return;
      sig.parentElement.addEventListener('click', function () {
        sig.classList.remove('stamp');
        void sig.offsetWidth; // restart animation
        sig.classList.add('stamp');
      });
    })();
  </script>
</body>
</html>
